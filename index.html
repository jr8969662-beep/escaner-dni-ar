<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escáner DNI Argentino</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <h1>Escáner DNI Argentino</h1>
  <p>Escaneo automático · PDF417 · QR · MRZ</p>
</header>

<main>
  <div class="captura-foto destacada" id="captura-dni">
    <div class="captura-visor">
      <video autoplay playsinline muted></video>
      <div class="marco-dni">
        <div class="marco-dni-texto">Encuadrá el código del DNI</div>
        <div class="scan-line"></div>
      </div>
      <div class="scan-indicador">
        <span>Buscando código</span>
        <span class="scan-dot"></span>
        <span class="scan-dot"></span>
        <span class="scan-dot"></span>
      </div>
      <button type="button" class="btn-flash" title="Activar/desactivar flash">🔦</button>
      <img hidden alt="DNI capturado">
    </div>
    <canvas hidden></canvas>

    <div class="captura-botones">
      <button type="button" class="btn-primario btn-camara">📷 Activar cámara</button>
      <button type="button" class="btn-secundario btn-repetir" hidden>🔄 Escanear otro</button>
    </div>

    <p class="captura-estado">Sin foto capturada</p>
    <p class="escaneo-estado"></p>
  </div>

  <section id="resultado" class="resultado" hidden>
    <div class="resultado-header">
      <h2>Datos detectados</h2>
      <span id="badge-metodo" class="badge">—</span>
    </div>

    <div class="campo"><label>Número de DNI</label><span id="r-dni">—</span></div>
    <div class="campo"><label>Apellido/s</label><span id="r-apellido">—</span></div>
    <div class="campo"><label>Nombre/s</label><span id="r-nombre">—</span></div>
    <div class="campo"><label>Sexo</label><span id="r-sexo">—</span></div>
    <div class="campo"><label>Fecha de nacimiento</label><span id="r-nacimiento">—</span></div>
    <div class="campo"><label>Fecha de emisión</label><span id="r-emision">—</span></div>
    <div class="campo"><label>Número de trámite</label><span id="r-tramite">—</span></div>
    <div class="campo"><label>Tipo documento</label><span id="r-tipo">—</span></div>

    <details class="raw-data">
      <summary>Ver texto crudo (debug)</summary>
      <pre id="r-raw">—</pre>
    </details>
  </section>
</main>

<script src="js/validators.js"></script>
<script src="js/parser.js"></script>
<script src="js/scanner.js"></script>
<script src="js/main.js"></script>

</body>
</html>
