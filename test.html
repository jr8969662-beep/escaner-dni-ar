<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Parser MRZ</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #e2e8f0; padding: 20px; }
    textarea { width: 100%; height: 120px; background: #1e293b; color: #e2e8f0; border: 1px solid #475569; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 14px; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    pre { background: #0b1220; padding: 16px; border-radius: 8px; overflow: auto; font-size: 13px; }
    h1 { color: #38bdf8; }
    .ok { color: #22c55e; }
    .bad { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🧪 Test del Parser MRZ</h1>
  <p>Pegá el texto crudo que ves en "Ver texto crudo":</p>
  <textarea id="input" placeholder="Pegá acá el texto crudo del OCR..."></textarea>
  <button onclick="probar()">Probar parser</button>
  <h2>Resultado:</h2>
  <pre id="out">—</pre>

  <script src="js/validators.js"></script>
  <script src="js/parser.js"></script>
  <script>
    function probar() {
      const texto = document.getElementById('input').value;
      const out = document.getElementById('out');
      try {
        const data = DNIParser.parsearUniversal(texto);
        out.innerHTML = '<span class="ok">✓ Parseado con método: ' + (data?.metodo || 'desconocido') + '</span>\n\n' +
                        JSON.stringify(data, null, 2);
      } catch (e) {
        out.innerHTML = '<span class="bad">✗ Error: ' + e.message + '</span>\n\n' + e.stack;
      }
    }
  </script>
</body>
</html>
